<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon Site Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #1d2671, #c33764);
    color: white;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
    background: rgba(0,0,0,0.3);
}

nav h2 {
    font-weight: bold;
}

nav a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
    transition: 0.3s;
}

nav a:hover {
    color: #00f7ff;
}

/* HERO */
.hero {
    text-align: center;
    margin-top: 100px;
}

.hero h1 {
    font-size: 50px;
}

.hero p {
    margin: 20px 0;
    font-size: 20px;
}

.btn {
    background: #00f7ff;
    color: black;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    background: white;
}

/* CARDS */
.cards {
    display: flex;
    justify-content: center;
    margin-top: 80px;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    width: 250px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
    background: rgba(255,255,255,0.2);
}

.card h3 {
    margin-bottom: 10px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h2>MySite</h2>
    <div>
        <a href="#">Accueil</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <h1>Welcome 🔥</h1>
    <p>Site dyali b design wa3er بزاف</p>
    <button class="btn">Start</button>
</div>

<!-- CARDS -->
<div class="cards">
    <div class="card">
        <h3>Service 1</h3>
        <p>Description dyal service</p>
    </div>

    <div class="card">
        <h3>Service 2</h3>
        <p>Description dyal service</p>
    </div>

    <div class="card">
        <h3>Service 3</h3>
        <p>Description dyal service</p>
    </div>
</div>

</body>
</html>

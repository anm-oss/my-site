<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Summaries</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

nav{
  padding:20px;
  background:#111827;
  display:flex;
  justify-content:space-between;
}

.hero{
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:45px;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  width:300px;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px;
  background:#38bdf8;
  color:black;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>

</head>

<body>

<nav>
  <h2>BookSumm</h2>
  <div>Home</div>
</nav>

<div class="hero">
  <h1>Welcome to Book Summaries 📚</h1>
  <p>Read smart, not long</p>
</div>

<div class="container">

  <div class="card">
    <h3>Book 1</h3>
    <p>Short summary of book 1...</p>
    <a class="btn" href="#">Read more</a>
  </div>

  <div class="card">
    <h3>Book 2</h3>
    <p>Short summary of book 2...</p>
    <a class="btn" href="#">Read more</a>
  </div>

  <div class="card">
    <h3>Book 3</h3>
    <p>Short summary of book 3...</p>
    <a class="btn" href="#">Read more</a>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Summary App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:30px;
}

h1{
  font-size:38px;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

input{
  width:300px;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#38bdf8;
}

.btn2{
  background:#f59e0b;
}

/* GRID */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  width:280px;
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.title{
  font-size:18px;
  font-weight:bold;
}

.summary{
  font-size:13px;
  color:#cbd5e1;
  margin-top:10px;
  display:none;
}

.card.open .summary{
  display:block;
}

.card.fav{
  border:2px solid #f59e0b;
}
</style>

</head>

<body>

<header>
  <h1>📚 Book Summary App</h1>
</header>

<div class="topbar">
  <input id="search" placeholder="Search book..." onkeyup="render()">
  <button class="btn" onclick="showAll()">All</button>
  <button class="btn2" onclick="showFav()">Favorites</button>
</div>

<div class="container" id="container"></div>

<script>

/* 🔥 DATA LAYER (like real apps) */
let books = [
  {
    id:1,
    title:"Atomic Habits",
    summary:"Small habits create big results. Focus on 1% daily improvement.",
    fav:false
  },
  {
    id:2,
    title:"Deep Work",
    summary:"Focus deeply without distraction to achieve high performance.",
    fav:false
  },
  {
    id:3,
    title:"Rich Dad Poor Dad",
    summary:"Learn how money works and build financial intelligence.",
    fav:false
  }
];

/* RENDER FUNCTION (CORE ENGINE) */
function render(){
  let container = document.getElementById("container");
  let search = document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  books
  .filter(b => b.title.toLowerCase().includes(search))
  .forEach(book => {

    let card = document.createElement("div");
    card.className = "card" + (book.fav ? " fav" : "");

    card.innerHTML = `
      <div class="title">${book.title}</div>
      
      <button onclick="toggleOpen(${book.id})">Open</button>
      <button onclick="toggleFav(${book.id})">⭐</button>

      <div class="summary">${book.summary}</div>
    `;

    container.appendChild(card);
  });
}

/* OPEN SUMMARY */
function toggleOpen(id){
  let card = document.querySelectorAll(".card")[id-1];
  card.classList.toggle("open");
}

/* FAVORITES SYSTEM */
function toggleFav(id){
  books = books.map(b => {
    if(b.id === id) b.fav = !b.fav;
    return b;
  });

  render();
}

/* FILTER FAVORITES */
function showFav(){
  let container = document.getElementById("container");
  container.innerHTML = "";

  books.filter(b => b.fav).forEach(book => {
    let card = document.createElement("div");
    card.className = "card fav";

    card.innerHTML = `
      <div class="title">${book.title}</div>
      <button onclick="toggleOpen(${book.id})">Open</button>
      <button onclick="toggleFav(${book.id})">⭐</button>
      <div class="summary">${book.summary}</div>
    `;

    container.appendChild(card);
  });
}

/* SHOW ALL */
function showAll(){
  render();
}

render();

</script>

</body>
</html>
